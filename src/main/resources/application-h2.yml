# Optional profile: run the app on an in-memory H2 database instead of PostgreSQL.
# Activate with: SPRING_PROFILES_ACTIVE=h2  (or -Dspring.profiles.active=h2)
spring:
  datasource:
    url: jdbc:h2:mem:notesdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console
